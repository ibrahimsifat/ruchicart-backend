services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    environment:
      PHP_IDE_CONFIG: "serverName=Docker"
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    networks:
      - ruchicart-network
    depends_on:
      - redis
      - db

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - ruchicart-network
    depends_on:
      - php

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: pass123
      MYSQL_DATABASE: ruchicartdb
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql/pid:/var/run/mysqld
    ports:
      - "3306:3306"
    networks:
      - ruchicart-network
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_NICE

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ruchicart_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: pass123
      UPLOAD_LIMIT: 64M
      MAX_EXECUTION_TIME: 300
      MEMORY_LIMIT: 256M
    ports:
      - "8081:80"
    networks:
      - ruchicart-network
    depends_on:
      - db
    volumes:
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php-phpmyadmin.ini
  redis:
    image: redis:alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - ruchicart-network

networks:
  ruchicart-network:
    driver: bridge

volumes:
  dbdata:
  redisdata:
