# Default server block for HTTP - redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ruchicart.com www.ruchicart.com;
    
    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Allow certbot authentication
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# Main server block for HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ruchicart.com www.ruchicart.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/ruchicart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruchicart.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ruchicart.com/chain.pem;

    # SSL Parameters
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (comment out during initial testing)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Root directory and index files
    root /var/www;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/ruchicart.access.log main;
    error_log /var/log/nginx/ruchicart.error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
 
 # phpMyAdmin configuration - ADDED THIS BLOCK
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Add security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Basic security
        proxy_read_timeout 90;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Main location block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling with FastCGI cache
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Enable FastCGI caching
        fastcgi_cache my_cache;
        fastcgi_cache_bypass $http_cache_control;
        fastcgi_no_cache $http_authorization $http_cache_control;
        add_header X-FastCGI-Cache $upstream_cache_status;
        
        # FastCGI optimizations
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Static file handling
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        
        # Enable compression for static files
        gzip_static on;
        # Add CORS headers if needed
        # add_header Access-Control-Allow-Origin "*";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive directories
    location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}